name: Banko syntax check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  banko-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell scripts
        run: |
          bash -n banko-linux/setup.sh
          bash -n banko-linux/run.sh
      - name: Check integration patches
        run: |
          python3 -m py_compile banko-linux/patch-integration.py
          python3 -m py_compile banko-linux/patch-player-inactive.py
          python3 -m py_compile banko-linux/patch-player-name.py
          python3 -m py_compile banko-linux/patch-player-board-shop.py
      - name: Build and syntax-check Banko server
        run: |
          rm -rf /tmp/pubbanko-check
          mkdir -p /tmp/pubbanko-check
          unzip -oq banko-linux/pubbanko_linux_latest.zip -d /tmp/pubbanko-check
          python3 banko-linux/patch-integration.py /tmp/pubbanko-check/server.js
          python3 banko-linux/patch-player-inactive.py /tmp/pubbanko-check/server.js
          python3 banko-linux/patch-player-name.py /tmp/pubbanko-check/server.js
          python3 banko-linux/patch-player-board-shop.py /tmp/pubbanko-check/server.js
          node --check /tmp/pubbanko-check/server.js
      - name: Verify player board flow
        run: |
          grep -q 'id="boardShopBox"' /tmp/pubbanko-check/server.js
          grep -q 'socket.on("player:requestBoards"' /tmp/pubbanko-check/server.js
          grep -q 'requestedBoardCount' /tmp/pubbanko-check/server.js
          grep -q 'TEST:</strong> Pris 0 kr.' /tmp/pubbanko-check/server.js
          if grep -q 'player:requestBoards.*jukebox\|player:requestBoards.*credit' /tmp/pubbanko-check/server.js; then
            echo "FEJL: Test-flow maa ikke traekke kredit"
            exit 1
          fi
